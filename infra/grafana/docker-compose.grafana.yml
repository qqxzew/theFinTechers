# Grafana for the Stáj Metrics screen (panels embedded by the UI via iframes).
# Start:  docker compose -f infra/grafana/docker-compose.grafana.yml up -d
# Stop:   docker compose -f infra/grafana/docker-compose.grafana.yml down
# The admin password is read from infra/grafana/.env (gitignored, generated locally).
name: staj-grafana

services:
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: staj-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # ${...} is interpolated by compose from infra/grafana/.env (project dir = this file's dir)
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in infra/grafana/.env}
      GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource 4.1.1"
      GF_PATHS_CONFIG: /etc/grafana/grafana.ini
      STAJ_API_URL: ${STAJ_API_URL:-http://host.docker.internal:8000}
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  grafana-data:
