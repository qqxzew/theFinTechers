# Minimal Grafana config for embedding Stáj evaluation panels in the UI (http://127.0.0.1:5173).

[server]
http_port = 3000
root_url = http://127.0.0.1:3000/

[security]
# Allow the UI to put panels in <iframe>s (drops X-Frame-Options: deny).
allow_embedding = true
# 127.0.0.1:5173 and 127.0.0.1:3000 are the same *site* (ports do not count), so Lax works.
# SameSite=None would require Secure cookies, i.e. HTTPS. Anonymous viewers need no cookie anyway.
cookie_samesite = lax
cookie_secure = false
disable_gravatar = true

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[auth]
disable_signout_menu = true

[users]
default_theme = light
allow_sign_up = false
home_page = /d/staj-eval/eval

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/eval.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[help]
enabled = false

[profile]
enabled = false

[unified_alerting]
enabled = false

[plugins]
plugin_admin_enabled = false
# Skip Grafana's default observability apps; Infinity comes from GF_INSTALL_PLUGINS.
# (preinstall_disabled = true would also block GF_INSTALL_PLUGINS.)
disable_plugins = grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app
