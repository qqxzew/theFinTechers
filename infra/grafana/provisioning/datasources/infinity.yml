apiVersion: 1

datasources:
  - name: Staj API
    uid: staj-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: true
    editable: false
    # Base URL; panel queries use relative paths such as /api/metrics.
    url: ${STAJ_API_URL}
    jsonData:
      url: ${STAJ_API_URL}
      auth_method: none
      allowedHosts:
        - ${STAJ_API_URL}
      timeoutInSeconds: 30
