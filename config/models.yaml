# All model IDs live here, never in code. Verified against `aws bedrock list-inference-profiles` (eu-central-1) on 2026-10-19.
region: eu-central-1
profile: hackathon          # AWS SSO profile (override with AWS_PROFILE)
roles:
  agent_primary: global.moonshotai.kimi-k3
  fallback: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
  bulk: eu.anthropic.claude-haiku-4-5-20251001-v1:0
# USD per token, PLACEHOLDERS (not official prices) - used only for budget guard-rails, shown as 'estimated' in the UI.
prices_placeholder:
  agent_primary: {in: 0.0000010, out: 0.0000030}
  fallback: {in: 0.0000030, out: 0.0000150}
  bulk: {in: 0.0000010, out: 0.0000050}
# Role used for interactive narrative (case explanation, OPO section V). Measured 2026-10-19: Kimi-K3 ~177-209 s per task, Sonnet 4.5 ~40-52 s;
# the agents (triage/investigation/QA) keep agent_primary. Change here only.
narrative_role: fallback
limits:
  max_steps: 12
  max_tokens: 60000
  max_cost_usd: 0.50
  timeout_s: 180
